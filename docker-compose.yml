services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./.docker/postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "${API_PORT}:3000"
    environment:
      FRONTEND_URL: ${FRONTEND_URL}
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      CI: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/game-core:/app/packages/game-core
      - api_node_modules:/app/node_modules
      - api_app_node_modules:/app/apps/api/node_modules
      - game_core_node_modules:/app/packages/game-core/node_modules
    command: pnpm --filter api start:dev

volumes:
  api_node_modules:
  api_app_node_modules:
  game_core_node_modules: